name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Record package versions (requirements-lock.txt)
        run: pip freeze --exclude-editable > requirements-lock.txt
      - name: Print lockfile
        run: |
          echo BEGIN_LOCKFILE
          cat requirements-lock.txt
          echo END_LOCKFILE
